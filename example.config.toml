# 藍 (Ai) Configuration File
#
# このファイルは藍の動作を制御する設定ファイルです。
# TOML形式で記述され、コメントも書けるため設定の管理が容易です。
#
# 詳細な設定については example.config.toml を参照してください。

# Misskey サーバー設定
host = "https://example.com"
i = "token"

# AI の基本情報
aiName = ["藍", "三須木"]
master = "admin" # ローカルの管理者のusername

# 基本機能の有効/無効
notingEnabled = true # 自動単語機能
keywordEnabled = true # キーワード検索
chartEnabled = true # チャート機能
reversiEnabled = true # リバーシ機能
timeSignalEnabled = true # 時刻通知
serverMonitoring = true
checkEmojisEnabled = true
checkEmojisAtOnce = true

# システム設定 - Docker環境向け
mecab = "/usr/bin/mecab" # MeCabのパス
mecabDic = "/usr/lib/x86_64-linux-gnu/mecab/dic/mecab-ipadic-neologd/" # MeCabの辞書のパス
memoryDir = "data" # メモリファイルの保存先

# フォロー設定
# followAllowedHostsが優先され、followExcludeInstancesを無視します。
# followAllowedHostsがなければfollowExcludeInstancesが優先されます。
followAllowedHosts = ["example.com", "example2.com"] # フォローを許可するホスト
followExcludeInstances = ["example.com", "example2.com"] # フォローを許可しないホスト

# ゲーム機能
mazeEnable = true # 迷路
pollEnable = true # 投票

# 投稿設定
postNotPublic = true # Publicで投稿しない
defaultVisibility = "public" # デフォルト投稿の公開範囲

# 天気予報設定
weatherAutoNotePref = "東京都" # 都道府県
weatherAutoNoteHour = 7 # 天気予報を投稿する時間

# Gemini AI 統合設定
[gemini]
enabled = true # Gemini機能全体の有効/無効
apiKey = "your-gemini-api-key" # Gemini API キー
model = "gemini-2.5-flash" # 使用するモデル
thinkingBudget = 32768 # thinking機能のトークン予算

# チャット機能設定
[gemini.chat]
enabled = true # チャット機能の有効/無効
prompt = "あなたはMisskeyで動作するAIアシスタント「藍」です。" # 基本プロンプト
groundingWithGoogleSearch = false # Google検索グラウンディングの有効/無効
enableMemory = true # 長期記憶機能の有効/無効
enablePersonalization = true # パーソナライゼーション機能の有効/無効

# ランダムトーク設定
[gemini.randomTalk]
enabled = false # ランダムトーク機能の有効/無効
probability = 0.02 # ランダムトークの発生確率
intervalMinutes = 720 # チェック間隔（分）
followingOnly = false # フォロー中のユーザーのみに反応
enableContext = true # 文脈情報の使用
contextRange = 5 # 文脈として取得する投稿数
contextUsageCount = 3 # 実際に使用する文脈投稿数

# 自動ノート投稿設定
[gemini.autoNote]
enabled = false # 自動ノート投稿の有効/無効
prompt = "今の気分や思いついたことを自由につぶやいてください。" # 自動ノート用プロンプト
intervalMinutes = 360 # 投稿間隔（分）
probability = 0.02 # 投稿確率
disableNightPosting = true # 深夜投稿の無効化
[gemini.autoNote.nightHours]
start = 23 # 深夜開始時刻
end = 5 # 深夜終了時刻

# Imagen 画像生成設定
[imagen]
enabled = false # Imagen機能の有効/無効
apiKey = "your-imagen-api-key" # Imagen API キー
model = "imagen-3.0-generate-002" # 使用するモデル

# 地震警報設定
[earthquake]
enabled = false # 地震警報機能の有効/無効
scale = 3 # 通知する最小震度

# その他の設定
[valentine]
# バレンタイン機能の設定

[serverMonitoring]
# サーバー監視の設定

# セリフのカスタマイズ
# 外部ファイルで管理することを推奨
# serifsPath = "./custom-serifs.toml"

# 地震速報設定
[earthquakeWarning]
enabled = true
minIntensityThreshold = 3 # 震度
minMagunitudeForWeak = 4.0 # 震源の規模  (注意: APIの仕様に合わせて意図的にtypoを保持)
websocketReconnectMaxAttempts = 10
websocketReconnectDelay = 5000
maxReconnectDelay = 300000
heartbeatTimeoutMs = 120000
heartbeatIntervalMs = 60000

# 気圧監視設定
[kiatsu]
locationCode = "13102" # 都道府県コード
requestTimeoutMs = 10000
maxErrorRetries = 5
updateIntervalMs = 600000
postIntervalMs = 43200000
errorCooldownMs = 3600000
minPostLevel = 2

# 情報モジュール設定
[info]
# イベントループの監視間隔 (ミリ秒)
eventLoopMonitoringInterval = 1000
# GC監視を有効にするか (Node.jsの--expose-gcフラグが必要です)
enableGCMonitoring = true
# 数値の小数点以下の表示桁数
precision = 2
