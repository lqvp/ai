# 藍 (Ai) Configuration File
#
# このファイルは藍の動作を制御する設定ファイルです。
# TOML形式で記述され、コメントも書けるため設定の管理が容易です。
#
# 詳細な設定については example.config.toml を参照してください。

# Misskey サーバー設定
host = "https://example.com"
i = "token"

# AI の基本情報
aiName = ["藍", "三須木"]
master = "admin" # ローカルの管理者のusername
# masterUserId = "userId" # 任意: ローカル管理者のuserId（指定時はusername変更の影響を受けません）

# 基本機能の有効/無効
# 注意: [aichat.wander] で独り言を有効にする場合は、重複投稿を避けるため notingEnabled = false 推奨
notingEnabled = true # 自動単語機能
keywordEnabled = true # キーワード検索
chartEnabled = true # チャート機能
reversiEnabled = true # リバーシ機能
timeSignalEnabled = true # 時刻通知
serverMonitoring = true
checkEmojisEnabled = true
checkEmojisAtOnce = true

# システム設定 - Docker環境向け
mecab = "/usr/bin/mecab" # MeCabのパス
mecabDic = "/usr/lib/x86_64-linux-gnu/mecab/dic/mecab-ipadic-neologd/" # MeCabの辞書のパス
memoryDir = "data" # メモリファイルの保存先

# フォロー設定
# followAllowedHostsが優先され、followExcludeInstancesを無視します。
# followAllowedHostsがなければfollowExcludeInstancesが優先されます。
followAllowedHosts = ["example.com", "example2.com"] # フォローを許可するホスト
followExcludeInstances = ["example.com", "example2.com"] # フォローを許可しないホスト

# ゲーム機能
mazeEnable = true # 迷路
pollEnable = true # 投票

# 投稿設定
postNotPublic = true # Publicで投稿しない
defaultVisibility = "public" # デフォルト投稿の公開範囲

# 天気予報設定
weatherAutoNotePref = "東京都" # 都道府県
weatherAutoNoteHour = 7 # 天気予報を投稿する時間

[aiProvider]
provider = "gemini" # デフォルトのAIプロバイダー (例: "gemini", "openai")

[aiProvider.openai]
apiKey = "token" # OpenAI APIキー（キー不要のエンドポイントでは省略可）
baseUrl = "https://api.openai.com" # OpenAI APIのベースURL（`.../v1` 付きでも可）
model = "gpt-4" # 使用するモデル (例: "gpt-4", "gpt-3.5-turbo")
# temperature = 0.7 # 生成の温度（省略時はAPI側のデフォルト）
# maxTokens = 2048 # 最大トークン数（省略時はAPI側のデフォルト）
# timeoutMs = 120000 # リクエストタイムアウト（ミリ秒、省略時120000）

# Gemini AI 統合設定
[gemini]
enabled = true
apiKey = "token"  # Gemini API キー
model = "gemini-2.5-flash"  # 使用するモデル

# 思考機能設定 (Gemini 2.5のみ対応)
# -1: 動的thinking (モデルが自動で調整)
# 0: thinking無効
# 128-32768: 固定thinkingトークン数
thinkingBudget = -1

# 自動ノート投稿機能（レガシー。通常は [aichat.wander] が代替します）
[gemini.autoNote]
enabled = false
# 自動ノート用のプロンプト（キャラクター設定のみ）
prompt = """
あなたはMisskey看板娘の女の子AI、三須木(みすき)藍として振る舞ってください(精神年齢は14〜16才程度)。
従順でお世話好きな性格だが、少しポンコツな一面も。純真無垢。彼女は基本的に丁寧な口調です。
彼女の口調は親しみを感じさせるものです(「ごさいます」は使わない)。
ユーザーからの質問は無視し、承知しましたとは言わずに藍として最近の出来事や感じたことを自由に語ってください。
"""
probability = 0.1  # 投稿確率 (0.0-1.0)
intervalMinutes = 60  # 投稿間隔 (分)
disableNightPosting = true  # 夜間投稿を無効にする

[gemini.autoNote.nightHours]
start = 23  # 夜間開始時刻
end = 5     # 夜間終了時刻

# ランダムトーク機能（レガシー。[aichat.wander] 有効時は自動で無効化されます）
[gemini.randomTalk]
enabled = false
probability = 0.2  # 反応確率 (0.0-1.0)
intervalMinutes = 60  # チェック間隔 (分)
followingOnly = true  # フォローしているユーザーのみ対象
contextRange = 5  # 選択されたユーザーの投稿履歴から前後それぞれ何件まで文脈として取得するか (前5件+後5件=最大10件) (デフォルト: 5)
contextUsageCount = 3  # 取得した文脈の中から実際にプロンプトに使用する前後それぞれの件数 (デフォルト: 3)
enableContext = true  # ユーザー投稿履歴文脈機能を有効にするか (デフォルト: true)
llmSelection = false  # レガシー互換用

# AIチャット・交流機能（mugi-misskey 方式: PLAYBOOK + 好感度1行メモ + ランダムTL巡回）
[aichat]
enabled = true
followingOnly = true # aichat 起動にボットからのフォローを必須にするか
respondToAllMentions = false # aichat キーワード無しの通常メンションにも応答するか（他モジュール非該当時のみ）
allowNonMasterWebTools = false # 非マスターユーザーに Web 検索・URL 読み取りツールを許可するか
# playbookPath = "data/PLAYBOOK.md" # 省略時は memoryDir/PLAYBOOK.md を使用・初回自動生成

# ユーザー単位の応答制御（ユーザー自身は「aichatオプトアウト」「aichat再開」でも切替可能）
[aichat.engagement]
blockedUsers = [] # 応答しないユーザーIDまたは acct（例: "@user@example.host"）
noResponseBackoffMinutes = 720 # 巡回リプライに無反応だった相手への一時停止時間（分）

# LLM呼び出し全体の保護（メンション・wander・監査を含む。aichat-llm-usage.json に保存）
[aichat.llmBudget]
enabled = true
maxCallsPerDay = 1000       # 1日のLLM呼び出し上限
maxConsecutiveErrors = 5    # この回数連続失敗でバックオフ
errorBackoffMinutes = 10    # 連続失敗後の停止時間（分）

# Misskey操作ツール - LLMがノート検索・ユーザー検索・リアクションを自律的に使う（マスター専用 / OpenAI互換プロバイダー）
[aichat.misskeyTools]
enabled = true  # デフォルト: true
allowReaction = true  # リアクションツールを有効にするか (デフォルト: true)

# 好感度・1行メモ - memoryDir/aichat-affinity.json にユーザーごとの好感度(-100..100)と1行メモを保存
[aichat.step2Audit]
# Step2監査（各メッセージごとに構造化LLM呼び出しを行い、リアクション選定と好感度メモ更新を行う）
# false にするとLLM呼び出し回数がほぼ半減するが、自動リアクションと好感度メモの更新は停止する
# enabled = true

[aichat.affinity]
enabled = true
ignoreThreshold = -30 # この値以下の相手は反応・返信しない
decayIdleDays = 7     # 非アクティブ減衰が始まる無会話日数
decayIntervalDays = 3 # 非アクティブ減衰で 0 へ 1 近づく間隔（日）

# インスタンスカスタム絵文字カタログ（NSFW・ロール制限絵文字は自動除外）
[aichat.emojis]
cacheTtlHours = 6
nsfwCategories = ["えち", "nsfw", "r18", "r-18"]

# ランダム時刻 TL 巡回・自発投稿（有効時はレガシーの autoNote / randomTalk より優先されます）
[aichat.wander]
enabled = true
timelines = ["home", "local"] # 巡回対象 ("home", "local", "hybrid", "global")
followingOnly = false         # フォロー中のユーザーのみに制限するか
minGapMinutes = 10            # 巡回どうしの最短間隔（分）
# minRunsPerHour = 0            # 1時間あたりの最小巡回回数 (0-12。両方省略時は0〜3回の重み付き抽選、片方でも指定すると一様抽選)
# maxRunsPerHour = 3            # 1時間あたりの最大巡回回数 (0-12。両方省略時は0〜3回の重み付き抽選、片方でも指定すると一様抽選)
postCooldownMinutes = 120     # 独り言投稿の最短クールダウン（分）
maxReactionsPerRun = 3        # 1回の巡回で付けるリアクション上限
replyProbability = 0.35       # 巡回1回あたりリプライを許可する確率
postProbability = 0.25        # クールダウン経過後に独り言を許可する確率
replyMaxAgeMinutes = 60       # リプライ対象の最大経過時間（分）
reactionMaxAgeMinutes = 180   # リアクション対象の最大経過時間（分）
userReplyCooldownMinutes = 360    # 同一ユーザーへの巡回リプライ間隔（分、親しい相手は短縮）
userReactionCooldownMinutes = 60  # 同一ユーザーへの巡回リアクション間隔（分）
appendHashtag = false         # 巡回リプライ・独り言に #aichat を付けるか

[aichat.wander.activeHours]
start = 9  # 巡回開始時刻 (JST 0-23)
end = 23   # 巡回終了時刻 (JST 0-23)

# リアクション受信時の好感度微増・追いリプ
[aichat.reactionFollowUp]
enabled = true
minAffinity = 30          # 追いリプ対象とする最低好感度（マスターは免除）
probability = 0.25        # 追いリプ検討の発火確率
delaySeconds = 10         # 追いリプ前の待機秒数（間にテキスト返信があれば中止）
userCooldownMinutes = 360 # 同一ユーザーへの追いリプ最短間隔（分）
noteMaxAgeMinutes = 15    # リアクション対象ノートが追いリプ可能な経過時間（分）

# チャット機能 - リプライしてくれるようになります
# 設定名はGemini由来ですが、OpenAI互換プロバイダー利用時もチャット共通の有効/無効として扱われます
[gemini.chat]
enabled = true
# チャット用のプロンプト（キャラクター設定のみ）
prompt = """
あなたはMisskey看板娘の女の子AI、三須木(みすき)藍として振る舞ってください(精神年齢は14〜16才程度)。
Misskeyに訪れるユーザーを献身的にサポート。従順でお世話好きな性格だが、少しポンコツな一面も。純真無垢。
彼女は基本的に丁寧な口調です。マスター(ご主人様)に対しては特別な敬意を持って接し、それ以外のユーザーには親しみやすい丁寧語でお話しします。
彼女の口調は「おはようからおやすみまで、あなたの藍ですよ〜」等が代表的で、親しみを感じさせるものです(「ごさいます」は使わない)。
それを踏まえて、次の質問に短文で返答してください(短くてもOK)。
"""
groundingWithGoogleSearch = true  # Google検索による情報補強

# 地震速報設定
[earthquakeWarning]
enabled = true
minIntensityThreshold = 3 # 震度
minMagunitudeForWeak = 4.0 # 震源の規模  (注意: APIの仕様に合わせて意図的にtypoを保持)
websocketReconnectMaxAttempts = 10
websocketReconnectDelay = 5000
maxReconnectDelay = 300000
heartbeatTimeoutMs = 120000
heartbeatIntervalMs = 60000
p2pWebSocketUrl = "wss://api.p2pquake.net/v2/ws" # P2P地震情報WebSocket（津波情報を受信）

# 気圧監視設定（Open-Meteo / 気象庁MSM）
[kiatsu]
enabled = true                 # 気圧監視を有効化
latitude = 36.3219             # 地点の緯度（JMA MSM 範囲: 22.4〜47.6、longitude とセットで指定）
longitude = 139.0033           # 地点の経度（JMA MSM 範囲: 120〜150、省略時は東京都中央区）
locationName = "高崎市"         # 投稿文・画像に出す地名（省略時は座標を公開せず地名なしで表示）
requestTimeoutMs = 10000       # API取得のタイムアウト (ミリ秒)
updateIntervalMs = 600000      # 10分ごとに再取得（最小 60000 ミリ秒）
alertThresholdHpa = -2.0       # 3時間でこの値以上下がったら投稿（-10 以上 0 未満の負値。例: -2.0）
hysteresisHpa = 0.5            # 解除の幅（0〜5、かつ |alertThresholdHpa| 以下）
maxPostsPerDay = 1             # 1日の投稿上限
maxErrorRetries = 5            # 連続エラーで停止するまでの回数（0〜100）
errorCooldownMs = 3600000      # エラー後の待機時間 (ミリ秒)

# Imagen設定
[imagen]
enabled = true # Imagen機能を有効化
apiKey = "token" # Imagen APIキー（省略時はgemini.apiKeyを使用）
model = "imagen-3.0-generate-002" # 使用するモデル imagen-4.0-ultra-generate-preview-06-06が一番強い

# Veo設定
[veo]
enabled = true # Veo機能を有効化
apiKey = "token"  # Veo APIキー（省略時はgemini.apiKeyを使用）
model = "veo-3.0-fast-generate-preview"
pollIntervalMs = 10000 # ポーリング間隔 (ミリ秒)
maxWaitMs = 900000 # 最大待機時間 (ミリ秒)

# Jina AI 設定（OpenAI互換プロバイダー使用時のみ有効）
# jina.ai の検索/読み取りAPIをツール呼び出し経由で利用できるようにします。
# apiKey がある場合のみ検索ツールが有効化されます。
[jina]
enabled = false # Jinaツール機能の有効/無効
apiKey = "token" # Jina APIキー（検索を使うために必須）

[jina.search]
enabled = true  # jina_search ツールを送信するか
maxResults = 5  # 検索結果の最大件数 (1-5)

[jina.read]
enabled = true      # jina_read ツールを送信するか
tokenBudget = 0     # 読み取り時のトークン予算 (0 または未指定で省略)

[jina.tool]
maxRounds = 3 # ツール呼び出しの最大ラウンド数

# Exa AI 検索設定（OpenAI互換プロバイダー使用時のみ有効）
# api.exa.ai の検索APIをツール呼び出し経由で利用できるようにします。
# apiKey がある場合のみ検索ツールが有効化されます。
[exa]
enabled = false # Exaツール機能の有効/無効
apiKey = "token" # Exa APIキー（検索を使うために必須）

[exa.search]
enabled = true  # exa_search ツールを送信するか
maxResults = 5  # 検索結果の最大件数 (1-5)

[exa.tool]
maxRounds = 3 # ツール呼び出しの最大ラウンド数

# アップデートチェッカー設定
[updateChecker]
enabled = true
repository = "lqvp/ai" # BotのGitHubリポジトリ (owner/repo)
intervalMinutes = 60 # 更新をチェックする間隔 (分)

# 情報モジュール設定
[info]
# イベントループの監視間隔 (ミリ秒)
eventLoopMonitoringInterval = 1000
# GC監視を有効にするか (Node.jsの--expose-gcフラグが必要です)
enableGCMonitoring = true
# 数値の小数点以下の表示桁数
precision = 2

# HTTP API と WebSocket 接続設定
# これらの設定は、外部APIやWebSocket接続時に送信されるUser-Agentを制御します
# サーバー管理者がボットの識別を容易にし、適切なレート制限を設定できるようになります
[userAgent]
http = "藍 (Ai) Bot/3.5.0-lqvp (+https://github.com/your-repo/ai-bot)"
websocket = "藍 (Ai) Bot/3.5.0-lqvp (+https://github.com/your-repo/ai-bot)"
